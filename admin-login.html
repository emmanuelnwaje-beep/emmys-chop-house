<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emmy's Chop-House | Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #111;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        .login-box h1 {
            text-align: center;
            color: #b8860b;
            margin-bottom: 8px;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .login-box label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #b8860b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #96700a;
        }

        .error {
            color: #c62828;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>EMMY'S CHOP-HOUSE</h1>

        <p>Admin Login</p>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <div
            class="error"
            id="loginError"
        >
            Incorrect username or password.
        </div>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Website
        </a>

    </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
    // your login JavaScript
</script>

    <script>

        const loginForm =
    document.getElementById("loginForm");

const loginError =
    document.getElementById("loginError");

loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
        document.getElementById("username")
            .value.trim();

    const password =
        document.getElementById("password")
            .value;

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        console.error("Login error:", error);

        loginError.textContent =
            "Incorrect email or password.";

        loginError.style.display = "block";

        return;
    }

    sessionStorage.setItem(
        "emmysAdminLoggedIn",
        "true"
    );

    window.location.href =
        "orders.html";

});
      
    </script>

</body>
</html>
